name: Vérifier le site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build:public
        env:
          SITE_URL: https://the42laws.fr
      - run: npm run check:public
      - run: git diff --exit-code -- atlas/data.js
